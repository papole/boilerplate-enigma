version: '3.5'

services:
   db:
    container_name: db_enigma
    image: mariadb:10.6.4-focal
    volumes:
      - ./init-db/init.sql:/data/application/init.sql
    restart: always
    networks:
      - network-boilerbasic
    environment:
      - MYSQL_ROOT_PASSWORD=enigma
      - MYSQL_DATABASE=basic_boiler
      - MYSQL_USER=enigma
      - MYSQL_PASSWORD=enigma
    ports:
      - 3307:3306
    command: --init-file /data/application/init.sql        
    expose:
      - 3307      

networks:
  network-boilerbasic:
  
